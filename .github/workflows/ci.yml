name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The database tests (tests/conftest.py), as make test-db
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Same as the Docker image; pyarrow (via swak) has no wheels for newer versions yet
          python-version: "3.13"
          enable-cache: true
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          # Read access to the private time-strolls-scraper (a deploy key there)
          ssh-private-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}
      - name: Install
        run: uv sync --extra test
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
        env:
          REQUIRE_TEST_DB: "1"

  replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --extra test
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  docker:
    # Make sure both images still build; pushing happens in the release workflow.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          # Read access to the private time-strolls-scraper (a deploy key there)
          ssh-private-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          ssh: default
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
