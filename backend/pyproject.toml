[project]
name = "timestrolls"
version = "0.0.0"
description = "Stroll in space and time."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "boto3",
    "envyaml",
    "fastapi",
    "gunicorn",
    # for uploads
    "python-multipart",
    "psycopg2-binary",
    "pydantic",
    "sqlmodel",
    "swak",
    "uvicorn",
    "requests",
    "gpxpy>=1.6.2",
    "shapely>=2.1.2",
    "geoalchemy2>=0.18.0",
    "time-strolls-scraping",
    "httpx>=0.28.1",
    "fastmcp>=2.12",
]

[project.optional-dependencies]
# Lightweight extra for CI: tests and lint only, without the geo/notebook stack.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff",
]
dev = [
    "timestrolls[test]",
    "matplotlib",
    "jupyter",
    "folium",
    "psycopg2",
    # zed
    "cst-lsp",
    # Geo Stuff
    "titiler.core",
    "morecantile",
    "rasterio",
    "rio-tiler",
    "pyproj",
    # Crawling
    "webdriver-manager",
    "tenacity",
    # Image
    "opencv-python",
]

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
time-strolls-scraping = { git = "ssh://git@github.com/8gradplus/time-strolls-scraper.git", tag = "v0.3.1" }
