api:
  # the admin's bearer token (all scopes; account 'admin')
  key: ${API_KEY}

database:
  driver: postgres
  ssl: false
  # postgres.timestrolls in docker compose (deployment/docker-compose.yml)
  host: ${POSTGRES_HOST|localhost}
  port: ${POSTGRES_PORT|5432}
  name: ${POSTGRES_DB|timestrolls}
  user: ${POSTGRES_USER|user}
  password: ${POSTGRES_USER_PASSWORD}

cdn:
  path:
    image: images
    podcast: podcasts
    tile: tiles
  credentials:
    key: ${SPACES_KEY}
    secret: ${SPACES_SECRET}
  bucket: timestrolls
  endpoint: https://fra1.digitaloceanspaces.com
