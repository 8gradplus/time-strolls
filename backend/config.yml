api:
  # the admin's bearer token (all scopes; account 'admin')
  key: ${API_KEY}

# Who may change content (ROADMAP.md, step 5). The app and the public MCP need
# no login. mode local: no login at all, a request without a token is the
# admin (make run-api, docker-compose.override.yml). mode oauth: bearer tokens,
# and people invited by email sign in with Google once GOOGLE_CLIENT_ID is set.
auth:
  mode: ${AUTH_MODE|oauth}
  base_url: ${PUBLIC_URL|https://timestrolls.debtray.com}
  google_client_id: ${GOOGLE_CLIENT_ID|}
  google_client_secret: ${GOOGLE_CLIENT_SECRET|}
  # signs the tokens our OAuth server issues and encrypts its store
  jwt_key: ${OAUTH_JWT_KEY|}

database:
  driver: postgres
  ssl: false
  # postgres.timestrolls in docker compose (deployment/docker-compose.yml)
  host: ${POSTGRES_HOST|localhost}
  port: ${POSTGRES_PORT|5432}
  name: ${POSTGRES_DB|timestrolls}
  user: ${POSTGRES_USER|user}
  password: ${POSTGRES_USER_PASSWORD}

cdn:
  path:
    image: images
    podcast: podcasts
  credentials:
    key: ${SPACES_KEY}
    secret: ${SPACES_SECRET}
  bucket: timestrolls
  endpoint: https://fra1.digitaloceanspaces.com
  #endpoint: /Users/viktor/Work/8gradplus/time-strolls/resources/
