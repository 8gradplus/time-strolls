# The whole stack. In production the images come from the registry, built
# and deployed by .github/workflows/release.yml; IMAGE_TAG picks the
# version. Passwords and keys come from .env next to this file (on the
# droplet the workflow writes it from the GitHub secrets, locally it's your
# own); everything else is written here. Locally, docker-compose.override.yml
# builds the images from source instead.
# The project name stays "deployment", so the live containers and volumes
# keep their names.
name: deployment

configs:
  caddy_config_file:
    file: ./Caddyfile.prod

services:
  postgres:
    image: postgis/postgis:13-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?}
      - POSTGRES_DB=timestrolls
    container_name: postgres
    hostname: postgres.timestrolls
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timestrolls"]

  # The migrations ship in the API image; copy them where Flyway reads them,
  # so a release pins code and migrations together
  migration-files:
    image: registry.digitalocean.com/debtray-registry/timestrolls-api:${IMAGE_TAG:-latest}
    volumes:
      - migrations:/sql
    command: sh -c "rm -rf /sql/* && cp -r /app/migration/. /sql/"

  migrate-postgres:
    image: flyway/flyway:11.9.1
    depends_on:
      postgres:
        condition: service_healthy
      migration-files:
        condition: service_completed_successfully
    volumes:
      - migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres.timestrolls:5432/timestrolls
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      # The restricted user the API connects with (created by the migrations)
      FLYWAY_PLACEHOLDERS_USER: user
      FLYWAY_PLACEHOLDERS_PASSWORD: ${POSTGRES_USER_PASSWORD:?}
      FLYWAY_SCHEMAS: timestrolls
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: -connectRetries=60 migrate

  api:
    image: registry.digitalocean.com/debtray-registry/timestrolls-api:${IMAGE_TAG:-latest}
    container_name: api
    hostname: api.timestrolls
    expose:
      - "8000"
    environment:
      - POSTGRES_HOST=postgres.timestrolls
      - POSTGRES_USER_PASSWORD=${POSTGRES_USER_PASSWORD:?}
      - SPACES_KEY=${SPACES_KEY:?}
      - SPACES_SECRET=${SPACES_SECRET:?}
      - API_KEY=${API_KEY:?}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully

  frontend:
    image: registry.digitalocean.com/debtray-registry/timestrolls-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    hostname: frontend.timestrolls
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.6.2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_started
    configs:
      - source: caddy_config_file
        target: /etc/caddy/Caddyfile
        mode: 0444
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config:
  migrations:
  # The live data. External: compose never creates or deletes it (not even
  # with "down -v") and refuses to start without it, instead of starting
  # with an empty database. Never run "docker compose down -v" on the droplet.
  postgres:
    external: true
    name: deployment_postgres
