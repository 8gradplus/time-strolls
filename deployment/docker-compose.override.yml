# Local development only (docker compose picks this file up by itself):
# builds the images from source, serves on localhost, opens the ports and
# uses a normal local database volume, created if missing.
configs:
  caddy_config_file:
    file: ./Caddyfile.local

volumes:
  postgres:
    external: false

services:
  postgres:
    ports:
      - "5432:5432"

  migrate-postgres:
    volumes:
      - ../backend/migration:/flyway/sql:ro

  api:
    build:
      context: ../backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
